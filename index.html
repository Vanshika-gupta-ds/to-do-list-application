<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Today's tasks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Today's tasks</h1>
  <p class="sub" id="summary"></p>

  <form id="form">
    <input type="text" id="input" placeholder="What needs doing?" aria-label="New task" maxlength="120" autocomplete="off">
    <button class="add" type="submit">Add task</button>
  </form>

  <div class="progress" aria-hidden="true"><div id="bar"></div></div>

  <div class="filters" role="group" aria-label="Filter tasks">
    <button data-filter="all" aria-pressed="true">All</button>
    <button data-filter="active" aria-pressed="false">To do</button>
    <button data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>
  <div class="foot">
    <span id="count"></span>
    <button class="clear" id="clear">Clear completed</button>
  </div>
</main>

<script src="script.js"></script>
</body>
</html>
